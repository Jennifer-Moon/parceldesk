# Render deployment config.
# Set SECRET_KEY and ALLOWED_HOSTS in the Render dashboard.
# No DATABASE_URL — the app uses SQLite, reseeded on each deploy.
services:
  - type: web
    name: parceldesk
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn parceldesk.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
